spring:
  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/stats
    username: stats
    password: stats

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/