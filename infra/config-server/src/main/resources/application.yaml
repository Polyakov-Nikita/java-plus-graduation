server:
  port: 0

spring:
  main:
    banner-mode: off
    log-startup-info: false

  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./infra/config-repo
            - file:./infra/config-repo/core
            - file:./infra/config-repo/stats
            - file:./infra/config-repo/infra